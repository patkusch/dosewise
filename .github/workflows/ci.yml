name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix: {python-version: ["3.10", "3.12", "3.13", "3.14"]}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python-version }}"}
      - run: pip install pytest && python -m pytest -q
      - run: python -m dosewise --catalog data/catalog.json --baseline data/baseline.json
      - run: pip install ruff && ruff check --isolated --select E,F,W --ignore E501 .
      - run: python -m compileall -q dosewise
      - run: python -m dosewise --catalog data/catalog.json --baseline data/baseline.json --format github --stability > /dev/null
