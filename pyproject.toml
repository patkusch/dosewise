[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dosewise"
version = "0.7.0"
description = "Rank data-catalog breakages by who is actually exposed"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
dosewise = "dosewise.cli:main"

[tool.setuptools]
packages = ["dosewise"]

[project.urls]
Homepage = "https://github.com/patkusch/dosewise"
Repository = "https://github.com/patkusch/dosewise"
Issues = "https://github.com/patkusch/dosewise/issues"
Changelog = "https://github.com/patkusch/dosewise/blob/main/CHANGELOG.md"
