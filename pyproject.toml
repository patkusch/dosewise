[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dosewise"
version = "0.2.0"
description = "Rank data-catalog breakages by who is actually exposed"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
dosewise = "dosewise.cli:main"

[tool.setuptools]
packages = ["dosewise"]
